name: Probe
on:
  push:
    branches: [probe]
    paths: ["scripts/probe.py", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/probe.py
      - run: |
          git config user.name "dashboard-bot"; git config user.email "dashboard-bot@users.noreply.github.com"
          git add -A probe probe2; git commit -m "Probe" && git push origin HEAD:probe
