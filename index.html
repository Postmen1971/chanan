<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1b2a4a">
<title>Familien-Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --glass: rgba(255,255,255,.13);
  --glass-strong: rgba(255,255,255,.2);
  --stroke: rgba(255,255,255,.26);
  --text: #fff;
  --muted: rgba(255,255,255,.72);
  --faint: rgba(255,255,255,.5);
  --radius: 30px;
  --gap: 16px;
  --shadow: 0 18px 50px rgba(10,15,40,.28);
  --bg1:#1b2a4a; --bg2:#3a3f8f; --bg3:#7b4fa0;
  --b1:#5ec8ff; --b2:#ff8fb1; --b3:#8a7dff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:Inter,-apple-system,"SF Pro Display",Roboto,"Segoe UI",sans-serif;
  color:var(--text);background:var(--bg1);
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-tap-highlight-color:transparent;
}
/* ---------- Hintergrund ---------- */
#bg{position:fixed;inset:0;z-index:-2;
  background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
  transition:background 4s ease}
.blob{position:fixed;z-index:-1;border-radius:50%;filter:blur(90px);opacity:.55;
  transition:background 4s ease;will-change:transform}
.blob.a{width:620px;height:620px;left:-140px;top:-180px;background:var(--b1);animation:float1 38s ease-in-out infinite}
.blob.b{width:560px;height:560px;right:-160px;top:120px;background:var(--b2);animation:float2 44s ease-in-out infinite}
.blob.c{width:520px;height:520px;left:30%;bottom:-260px;background:var(--b3);animation:float3 50s ease-in-out infinite}
@keyframes float1{50%{transform:translate(160px,120px) scale(1.12)}}
@keyframes float2{50%{transform:translate(-140px,90px) scale(.9)}}
@keyframes float3{50%{transform:translate(120px,-110px) scale(1.15)}}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 3s;z-index:50}

/* ---------- Gerüst ---------- */
#app{height:100vh;display:grid;gap:var(--gap);padding:14px 20px 18px;
  grid-template-columns:1.25fr 1fr .95fr;
  grid-template-rows:auto 1fr 1fr;
  grid-template-areas:"head head head" "wetter wetter abfall" "rezept rezept termine";
  transition:transform 2s}
.card{position:relative;background:var(--glass);border:1px solid var(--stroke);border-radius:var(--radius);
  -webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.25);
  padding:16px 20px;overflow:hidden;min-height:0}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,0) 45%)}
.label{font-size:12.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;gap:8px;margin-bottom:10px}
.label svg{width:16px;height:16px;opacity:.9}

/* ---------- Kopf ---------- */
#head{grid-area:head;display:flex;align-items:center;gap:22px;padding:2px 4px}
#clock{font-size:58px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
#date{font-size:18px;font-weight:500;color:var(--muted);line-height:1.3;white-space:nowrap}
#greet{font-size:20px;font-weight:700;color:#fff;white-space:nowrap}
#dock{margin-left:auto;display:flex;gap:10px;padding:8px;border-radius:26px;background:var(--glass);
  border:1px solid var(--stroke);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);box-shadow:var(--shadow)}
.appbtn{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:18px;width:76px;height:60px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:600 11px Inter,sans-serif;cursor:pointer;
  transition:transform .15s, background .2s}
.appbtn:active{transform:scale(.92);background:rgba(255,255,255,.28)}
.appbtn svg{width:26px;height:26px}

/* ---------- Wetter ---------- */
#wetter{grid-area:wetter;display:flex;flex-direction:column}
#wetter .label{margin-bottom:4px}
.w-top{display:flex;align-items:center;gap:22px;flex:1;min-height:0}
.w-now{display:flex;align-items:center;gap:14px}
.w-icon{width:96px;height:96px;flex:none;filter:drop-shadow(0 10px 22px rgba(0,0,0,.18))}
.w-temp{font-size:74px;font-weight:300;letter-spacing:-.05em;line-height:.95}
.w-temp sup{font-size:32px;font-weight:400;vertical-align:top;position:relative;top:8px}
.w-desc{font-size:19px;font-weight:700;margin-top:2px}
.w-meta{font-size:13.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.w-sun{margin-left:auto;width:300px;flex:none}
.w-sun svg{width:100%;height:auto;display:block;overflow:visible}
.sun-times{display:grid;grid-template-columns:auto 1fr auto;align-items:end;font-size:12px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.sun-times b{display:block;color:#fff;font-size:20px;font-weight:700;letter-spacing:0;text-transform:none}
.sun-times .r{text-align:right}
.daylen{font-size:12px;color:var(--faint);text-align:center;text-transform:none;letter-spacing:0;font-weight:500;line-height:1.3}
.w-days{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px}
.day{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:8px 6px 7px;text-align:center;
  display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;align-items:center;justify-content:center;column-gap:8px}
.day .n{grid-column:1/3;font-size:14px;font-weight:700;color:var(--muted)}
.day svg{width:44px;height:44px;grid-row:2}
.day .tt2{grid-row:2;text-align:left}
.day .t{font-size:19px;font-weight:700;line-height:1.1}
.day .t span{color:var(--faint);font-weight:500}
.day .r{font-size:12px;color:#cfe9ff;font-weight:600;min-height:14px}

/* ---------- Abfall ---------- */
#abfall{grid-area:abfall}
.bins{display:flex;flex-direction:column;gap:5px}
.bin{display:flex;align-items:center;gap:12px;padding:4px 10px 4px 4px;border-radius:18px;background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.12)}
.bin .ic{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;flex:none}
.bin .ic svg{width:25px;height:25px}
.bin .nm{font-size:15.5px;font-weight:700;line-height:1.15}
.bin .dt{font-size:12.5px;color:var(--muted);margin-top:1px;white-space:nowrap}
.bin .rel{margin-left:auto;font-size:13px;font-weight:700;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.14);white-space:nowrap}
.bin.soon{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.35);box-shadow:0 0 0 2px rgba(255,255,255,.12), 0 8px 26px rgba(0,0,0,.15)}
.bin.soon .rel{background:#fff;color:#1d2440}
.bin.today .rel{background:#e0102a;color:#fff;letter-spacing:.04em}
.bin.today .dt b{color:#ff6b7d}
.bin.off{opacity:.55}
.bin.off .rel{background:none;font-weight:600;color:var(--muted)}
.hint{font-size:14px;color:var(--muted);line-height:1.5}
.hint b{color:#fff}

/* ---------- Termine ---------- */
#termine{grid-area:termine}
.ev{display:flex;gap:12px;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.ev:last-child{border-bottom:0}
.ev .cal{width:44px;flex:none;border-radius:14px;overflow:hidden;text-align:center;background:rgba(255,255,255,.92);color:#1d2440;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.ev .cal .m{background:#ff5a6e;color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.08em;padding:1px 0}
.ev .cal .d{font-size:18px;font-weight:800;line-height:1.2}
.ev .tt{font-size:15px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.ev .pl{font-size:12.5px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.ev .rl{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;padding-left:6px}
.star{color:#ffd76a}

/* ---------- Rezept ---------- */
#rezept{grid-area:rezept;display:grid;grid-template-columns:36% 1fr;gap:18px;padding:14px}
.r-img{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(140deg,#ffb36b,#ff6f91);min-height:0}
.r-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s}
.r-img img.ok{opacity:1}
.r-img .emo{position:absolute;inset:0;display:grid;place-items:center;font-size:96px}
.r-img .badges{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
.badge{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(20,20,35,.45);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.25)}
.r-body{display:flex;flex-direction:column;min-height:0;padding:4px 4px 0 0}
.r-name{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.r-meta{font-size:13.5px;color:var(--muted);margin:4px 0 8px;display:flex;gap:14px;flex-wrap:wrap}
.r-cols{display:grid;grid-template-columns:1fr 1.35fr;gap:16px;flex:1;min-height:0;overflow:hidden;
  -webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent)}
.r-cols h4{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.r-cols ul{list-style:none;font-size:13.5px;line-height:1.42}
.r-cols ul li::before{content:"•";color:#ffd76a;margin-right:7px}
.r-cols ol{list-style:none;counter-reset:s;font-size:13.5px;line-height:1.38}
.r-cols ol li{counter-increment:s;display:flex;gap:8px;margin-bottom:5px}
.r-cols ol li::before{content:counter(s);flex:none;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.2);
  font-size:11px;font-weight:800;display:grid;place-items:center;margin-top:1px}
.r-foot{display:flex;align-items:center;gap:10px;margin-top:6px}
.r-tip{font-size:13.5px;color:#fff;background:rgba(255,255,255,.12);border-radius:14px;padding:8px 12px;flex:1;line-height:1.35}
.r-tip b{color:#ffd76a}
.nav{display:flex;gap:8px}
.nav button,.chip{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;border-radius:14px;
  font:700 14px Inter,sans-serif;cursor:pointer}
.nav button{width:46px;height:42px;font-size:20px}
.nav button:active,.chip:active{transform:scale(.94)}
.chips{position:absolute;left:8px;right:8px;bottom:9px;display:flex;gap:5px;z-index:2;flex-wrap:wrap}
.chip{padding:6px 9px;font-size:12px;border-radius:999px;background:rgba(20,20,35,.4);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.chip.on{background:#fff;color:#1d2440}
.r-head{display:flex;align-items:flex-start;gap:10px}

/* ---------- Tipp-Leiste ---------- */
#tipline{display:flex;align-items:center;gap:10px;max-width:430px;font-size:14px;line-height:1.35;color:var(--muted)}
#tipline .ico{font-size:22px}
#tipline b{color:#fff;display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.fade{animation:fade .8s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Großansicht Rezept ---------- */
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(10,12,30,.45);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#modal.open{display:flex}
#modal .card{width:min(1100px,92vw);max-height:88vh;overflow:auto;padding:28px 32px;background:rgba(40,44,80,.55)}
#modal h2{font-size:34px;font-weight:800;letter-spacing:-.02em}
#modal .cols{display:grid;grid-template-columns:1fr 1.4fr;gap:30px;margin-top:18px;font-size:19px;line-height:1.55}
#modal h4{font-size:14px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
#modal ul,#modal ol{padding-left:22px}
#modal li{margin-bottom:6px}
#modal .close{position:absolute;right:18px;top:16px;width:48px;height:48px;border-radius:50%;border:1px solid var(--stroke);
  background:rgba(255,255,255,.15);color:#fff;font-size:24px;cursor:pointer}
.small{font-size:12px;color:var(--faint)}
.upd{font-size:11px;color:var(--faint);position:absolute;right:18px;top:20px}
.err{color:#ffd0d0}
</style>
</head>
<body>
<div id="bg"></div><div class="blob a"></div><div class="blob b"></div><div class="blob c"></div>
<div id="dim"></div>

<main id="app">
  <header id="head">
    <div>
      <div id="clock">--:--</div>
    </div>
    <div>
      <div id="greet">Hallo!</div>
      <div id="date"></div>
    </div>
    <div id="tipline"></div>
    <nav id="dock" aria-label="Apps"></nav>
  </header>

  <section class="card" id="wetter">
    <div class="label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Wetter · Ebersbach an der Fils</div>
    <span class="upd" id="wupd"></span>
    <div class="w-top">
      <div class="w-now">
        <div class="w-icon" id="wicon"></div>
        <div>
          <div class="w-temp" id="wtemp">--<sup>°</sup></div>
          <div class="w-desc" id="wdesc">Lade Wetter …</div>
          <div class="w-meta" id="wmeta"></div>
        </div>
      </div>
      <div class="w-sun" id="wsun"></div>
    </div>
    <div class="w-days" id="wdays"></div>
  </section>

  <section class="card" id="abfall">
    <div class="label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Abfuhrtermine</div>
    <div class="bins" id="bins"><div class="hint">Lade …</div></div>
  </section>

  <section class="card" id="rezept">
    <div class="r-img"><div id="rimg" style="position:absolute;inset:0"></div><div class="chips" id="chips"></div></div>
    <div class="r-body">
      <div class="r-head">
        <div style="flex:1;min-width:0">
          <div class="label" style="margin-bottom:6px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 13.9A4 4 0 0 1 7 6a5 5 0 0 1 10 0 4 4 0 0 1 1 7.9V20H6z"/><path d="M6 17h12"/></svg>Rezept des Tages</div>
          <div class="r-name" id="rname"></div>
        </div>
        <div class="nav"><button id="rprev" aria-label="Vorheriges">‹</button><button id="rnext" aria-label="Nächstes">›</button></div>
      </div>
      <div class="r-meta" id="rmeta"></div>
      <div class="r-cols">
        <div><h4>Zutaten</h4><ul id="ring"></ul></div>
        <div><h4>So geht's</h4><ol id="rsteps"></ol></div>
      </div>
      <div class="r-foot">
        <div class="r-tip" id="rtip"></div>
      </div>
    </div>
  </section>

  <section class="card" id="termine">
    <div class="label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Was ist los in Ebersbach</div>
    <div id="events"><div class="hint">Lade …</div></div>
  </section>
</main>

<div id="modal" role="dialog" aria-modal="true"><div class="card" id="mcard"></div></div>

<script>
/* ======================================================================
   Einstellungen
   ====================================================================== */
const ORT = {name:"Ebersbach an der Fils", lat:48.7158, lon:9.5236};

// App-Leiste: Android-Paketnamen. Weitere Apps einfach ergänzen.
const APPS = [
  {name:"YouTube",  pkg:"com.google.android.youtube",            icon:"play",  web:"https://www.youtube.com"},
  {name:"YT Music", pkg:"com.google.android.apps.youtube.music", icon:"music", web:"https://music.youtube.com"},
  {name:"Netflix",  pkg:"com.netflix.mediaclient",               icon:"film",  web:"https://www.netflix.com"},
  {name:"Spotify",  pkg:"com.spotify.music",                     icon:"phones",web:"https://open.spotify.com"},
  {name:"Chrome",   pkg:"com.android.chrome",                    icon:"web",   web:"https://www.google.de"},
];

const WASTE = {
  papier:{name:"Blaue Tonne", sub:"Papier",      color:"#2f7bf6", shape:"bin"},
  rest:  {name:"Restmüll",    sub:"Graue Tonne", color:"#66707f", shape:"bin"},
  bio:   {name:"Biotonne",    sub:"Bioabfall",   color:"#8a5a33", shape:"bin"},
  gelb:  {name:"Gelber Sack", sub:"Verpackungen",color:"#f2c21b", shape:"sack"},
  gruen: {name:"Grüngut",     sub:"Gartenabfall",color:"#33b55a", shape:"leaf"},
};

/* ======================================================================
   Hilfen
   ====================================================================== */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const TAGE = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const TK = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const MON = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const MK = ["JAN","FEB","MÄR","APR","MAI","JUN","JUL","AUG","SEP","OKT","NOV","DEZ"];
const store = {
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
function parseDay(s){const [y,m,d]=s.slice(0,10).split("-").map(Number);return new Date(y,m-1,d)}
function today0(){const d=new Date();d.setHours(0,0,0,0);return d}
function daysFrom(d){return Math.round((d - today0())/864e5)}
function relDay(n){
  if(n===0) return "Heute"; if(n===1) return "Morgen"; if(n===2) return "Übermorgen";
  if(n<0) return "läuft"; return "in "+n+" Tagen";
}
function hm(d){return pad(d.getHours())+":"+pad(d.getMinutes())}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
async function getJSON(url){
  const r = await fetch(url + (url.includes("?")?"&":"?") + "t=" + Date.now(), {cache:"no-store"});
  if(!r.ok) throw new Error(r.status);
  return r.json();
}

/* ======================================================================
   Symbole (eigene SVGs)
   ====================================================================== */
const ICON = {
  sun:`<svg viewBox="0 0 64 64"><defs><radialGradient id="gs" cx=".4" cy=".35"><stop offset="0" stop-color="#fff6b0"/><stop offset=".55" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff9f1c"/></radialGradient></defs><g stroke="#ffd23f" stroke-width="3.2" stroke-linecap="round" class="rays"><path d="M32 4v7M32 53v7M4 32h7M53 32h7M12.2 12.2l5 5M46.8 46.8l5 5M12.2 51.8l5-5M46.8 17.2l5-5"/></g><circle cx="32" cy="32" r="13" fill="url(#gs)"/></svg>`,
  moon:`<svg viewBox="0 0 64 64"><defs><linearGradient id="gm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffbe6"/><stop offset="1" stop-color="#d6d9ff"/></linearGradient></defs><path d="M40 10a22 22 0 1 0 14 34A18 18 0 0 1 40 10z" fill="url(#gm)"/><circle cx="16" cy="14" r="1.6" fill="#fff"/><circle cx="52" cy="18" r="1.2" fill="#fff"/><circle cx="10" cy="40" r="1" fill="#fff"/></svg>`,
  cloud:`<svg viewBox="0 0 64 64"><defs><linearGradient id="gc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#dfe7f5"/></linearGradient></defs><path d="M18 50h30a11 11 0 0 0 1-22 15 15 0 0 0-29 3 9.5 9.5 0 0 0-2 19z" fill="url(#gc)"/></svg>`,
};
function cloudPath(dx=0,dy=0,s=1,fill="url(#gc2)"){return `<path transform="translate(${dx} ${dy}) scale(${s})" d="M18 50h30a11 11 0 0 0 1-22 15 15 0 0 0-29 3 9.5 9.5 0 0 0-2 19z" fill="${fill}"/>`}
function wIcon(kind, day){
  const defs = `<defs><linearGradient id="gc2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#dbe4f3"/></linearGradient><linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9d3e6"/><stop offset="1" stop-color="#8f9bb3"/></linearGradient><radialGradient id="gs2" cx=".4" cy=".35"><stop offset="0" stop-color="#fff6b0"/><stop offset=".55" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff9f1c"/></radialGradient><linearGradient id="gm2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffbe6"/><stop offset="1" stop-color="#d6d9ff"/></linearGradient></defs>`;
  const sunSmall = `<g transform="translate(20 4) scale(.62)"><g stroke="#ffd23f" stroke-width="3.6" stroke-linecap="round"><path d="M32 4v7M53 32h7M46.8 17.2l5-5M12.2 12.2l5 5M32 53v0"/></g><circle cx="32" cy="32" r="13" fill="url(#gs2)"/></g>`;
  const moonSmall = `<g transform="translate(24 2) scale(.55)"><path d="M40 10a22 22 0 1 0 14 34A18 18 0 0 1 40 10z" fill="url(#gm2)"/></g>`;
  const drops = n => Array.from({length:n},(_,i)=>`<path d="M${22+i*9} 52l-3 7" stroke="#7cc4ff" stroke-width="3.2" stroke-linecap="round"/>`).join("");
  const flakes = n => Array.from({length:n},(_,i)=>`<g transform="translate(${20+i*12} 56)" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M0-5.5v11M-4.8-2.75l9.6 5.5M-4.8 2.75l9.6-5.5"/></g>`).join("");
  let body="";
  switch(kind){
    case "clear": return day?ICON.sun:ICON.moon;
    case "partly": body=(day?sunSmall:moonSmall)+cloudPath(-4,6,.92); break;
    case "cloudy": body=cloudPath(6,-6,.75,"url(#gd)")+cloudPath(-4,4,.95); break;
    case "fog": body=cloudPath(0,-4,.9)+`<g stroke="#e8eef8" stroke-width="3" stroke-linecap="round"><path d="M12 52h40M18 59h30"/></g>`; break;
    case "drizzle": body=cloudPath(0,-8,.95)+drops(3); break;
    case "rain": body=cloudPath(0,-8,.95,"url(#gd)")+drops(4); break;
    case "snow": body=cloudPath(0,-8,.95)+flakes(3); break;
    case "thunder": body=cloudPath(0,-8,.95,"url(#gd)")+`<path d="M33 42l-7 11h6l-3 9 10-13h-6l4-7z" fill="#ffd23f"/>`; break;
    default: body=cloudPath(0,0,1);
  }
  return `<svg viewBox="0 0 64 64">${defs}${body}</svg>`;
}
function wmo(code){
  const m = {
    0:["clear","Klar"],1:["partly","Überwiegend sonnig"],2:["partly","Teils bewölkt"],3:["cloudy","Bewölkt"],
    45:["fog","Nebel"],48:["fog","Nebel mit Reif"],51:["drizzle","Leichter Niesel"],53:["drizzle","Nieselregen"],55:["drizzle","Starker Niesel"],
    56:["drizzle","Gefrierender Niesel"],57:["drizzle","Gefrierender Niesel"],61:["rain","Leichter Regen"],63:["rain","Regen"],65:["rain","Starker Regen"],
    66:["rain","Gefrierender Regen"],67:["rain","Gefrierender Regen"],71:["snow","Leichter Schnee"],73:["snow","Schneefall"],75:["snow","Starker Schnee"],
    77:["snow","Schneegriesel"],80:["rain","Regenschauer"],81:["rain","Regenschauer"],82:["rain","Heftige Schauer"],85:["snow","Schneeschauer"],86:["snow","Schneeschauer"],
    95:["thunder","Gewitter"],96:["thunder","Gewitter mit Hagel"],99:["thunder","Gewitter mit Hagel"]
  };
  return m[code] || ["cloudy","—"];
}

/* ======================================================================
   Uhr, Begrüßung, Hintergrund nach Tageszeit
   ====================================================================== */
let SUN = {rise:null,set:null};
const PHASES = {
  night:{bg:["#0d1330","#1d2257","#3b2a6b"], b:["#3a56d4","#7a3fd1","#1f8bd6"]},
  dawn: {bg:["#2c3e7a","#c06c84","#f8b195"], b:["#ffb38a","#ff7eb3","#7a8cff"]},
  day:  {bg:["#2d6fd6","#3fa7e8","#7fd3e6"], b:["#9be7ff","#6aa8ff","#b49cff"]},
  dusk: {bg:["#2a2357","#8e3f8f","#f0846b"], b:["#ff9a5c","#d65db1","#5b6cf0"]},
};
function phaseNow(now){
  const rise = SUN.rise || new Date(now.getFullYear(),now.getMonth(),now.getDate(),7,30);
  const set  = SUN.set  || new Date(now.getFullYear(),now.getMonth(),now.getDate(),16,45);
  const h=36e5, t=now.getTime(), r=rise.getTime(), s=set.getTime();
  if(t < r - h || t > s + h) return "night";
  if(t < r + h) return "dawn";
  if(t > s - h) return "dusk";
  return "day";
}
let lastPhase="";
function applyPhase(){
  const p = phaseNow(new Date());
  if(p===lastPhase) return; lastPhase=p;
  const s=document.documentElement.style, c=PHASES[p];
  s.setProperty("--bg1",c.bg[0]);s.setProperty("--bg2",c.bg[1]);s.setProperty("--bg3",c.bg[2]);
  s.setProperty("--b1",c.b[0]);s.setProperty("--b2",c.b[1]);s.setProperty("--b3",c.b[2]);
  document.querySelector('meta[name=theme-color]').content=c.bg[0];
}
function tick(){
  const n=new Date(), h=n.getHours();
  $("clock").textContent = hm(n);
  $("date").textContent = `${TAGE[n.getDay()]}, ${n.getDate()}. ${MON[n.getMonth()]}`;
  $("greet").textContent = h<5?"Gute Nacht":h<11?"Guten Morgen":h<14?"Mahlzeit":h<18?"Schönen Nachmittag":h<22?"Guten Abend":"Gute Nacht";
  // Nachts dunkler (23–6 Uhr), damit das Display nicht blendet
  $("dim").style.opacity = (h>=23||h<6) ? .45 : 0;
  applyPhase();
}

async function loadWeather(){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${ORT.lat}&longitude=${ORT.lon}`+
    `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day,precipitation`+
    `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset`+
    `&timezone=Europe%2FBerlin&forecast_days=6`;
  try{
    const d = await getJSON(url);
    store.set("wetter",d);
    renderWeather(d,false);
  }catch(e){
    const old = store.get("wetter");
    if(old) renderWeather(old,true);
    else $("wdesc").innerHTML = `<span class="err">Wetter gerade nicht erreichbar</span>`;
  }
}
function renderWeather(d, stale){
  const c=d.current, dl=d.daily;
  const [kind,text] = wmo(c.weather_code);
  $("wicon").innerHTML = wIcon(kind, c.is_day);
  $("wtemp").innerHTML = Math.round(c.temperature_2m)+"<sup>°</sup>";
  $("wdesc").textContent = text;
  $("wmeta").innerHTML = `Heute ${Math.round(dl.temperature_2m_min[0])}° bis ${Math.round(dl.temperature_2m_max[0])}° · gefühlt ${Math.round(c.apparent_temperature)}°<br>`+
    `Wind ${Math.round(c.wind_speed_10m)} km/h · Luftfeuchte ${c.relative_humidity_2m} %`+
    (dl.precipitation_probability_max[0]!=null?` · Regen ${dl.precipitation_probability_max[0]} %`:"");
  SUN.rise = new Date(dl.sunrise[0]); SUN.set = new Date(dl.sunset[0]);
  lastPhase=""; applyPhase();
  renderSun();
  let html="";
  for(let i=1;i<=5 && i<dl.time.length;i++){
    const day=parseDay(dl.time[i]); const [k]=wmo(dl.weather_code[i]);
    const rp=dl.precipitation_probability_max[i];
    html+=`<div class="day"><div class="n">${i===1?"Morgen":TK[day.getDay()]+", "+day.getDate()+"."}</div>${wIcon(k,1)}
      <div class="tt2"><div class="t">${Math.round(dl.temperature_2m_max[i])}° <span>${Math.round(dl.temperature_2m_min[i])}°</span></div>
      <div class="r">${rp>=20?"Regen "+rp+" %":"trocken"}</div></div></div>`;
  }
  $("wdays").innerHTML=html;
  $("wupd").textContent = stale ? "offline – letzter Stand" : "";
}
function renderSun(){
  if(!SUN.rise) return;
  const now=new Date(), r=SUN.rise, s=SUN.set;
  let p=(now-r)/(s-r); const up = p>=0 && p<=1; p=Math.max(0,Math.min(1,p));
  const W=300,H=104,cx=W/2,cy=H-6,R=128;
  const a=Math.PI*(1-p), x=cx+R*Math.cos(a), y=cy-R*Math.sin(a)*0.82;
  const len=s-r, lh=Math.floor(len/36e5), lm=Math.round((len%36e5)/6e4);
  $("wsun").innerHTML = `
  <svg viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="arc" x1="0" x2="1"><stop offset="0" stop-color="#ffd36b" stop-opacity=".2"/><stop offset=".5" stop-color="#ffe9a8"/><stop offset="1" stop-color="#ff9b6b" stop-opacity=".2"/></linearGradient>
    <radialGradient id="sg"><stop offset="0" stop-color="#fff6c8"/><stop offset=".5" stop-color="#ffd23f"/><stop offset="1" stop-color="#ffb02e" stop-opacity="0"/></radialGradient></defs>
    <line x1="6" y1="${cy}" x2="${W-6}" y2="${cy}" stroke="rgba(255,255,255,.3)" stroke-width="1.5" stroke-dasharray="3 5"/>
    <path d="M${cx-R} ${cy} A ${R} ${R*0.82} 0 0 1 ${cx+R} ${cy}" fill="none" stroke="url(#arc)" stroke-width="3" stroke-linecap="round"/>
    ${up?`<circle cx="${x}" cy="${y}" r="20" fill="url(#sg)"/><circle cx="${x}" cy="${y}" r="8" fill="#ffe27a"/>`:
         `<circle cx="${cx}" cy="${cy-38}" r="0"/>`}
  </svg>
  <div class="sun-times"><div>☀︎ Aufgang<b>${hm(r)}</b></div><div class="daylen">${lh} Std ${lm} Min<br>Tageslicht</div><div class="r">Untergang ☾<b>${hm(s)}</b></div></div>`;
}

async function loadAbfall(){
  let d;
  try{ d = await getJSON("data/abfall.json"); store.set("abfall",d) }catch(e){ d = store.get("abfall") }
  const box=$("bins");
  // heutige Abholung bis 14 Uhr anzeigen, danach zählt der nächste Termin
  const minDay = new Date().getHours()<14 ? 0 : 1;
  const items=(d&&d.items||[]).map(x=>({...x,day:parseDay(x.date)})).filter(x=>daysFrom(x.day)>=minDay);
  if(!items.length){
    box.innerHTML = Object.values(WASTE).map(w=>`<div class="bin"><div class="ic" style="background:${w.color}">${binIcon(w.shape)}</div>
      <div><div class="nm">${w.name}</div><div class="dt">${w.sub}</div></div><div class="rel">Termin folgt</div></div>`).join("");
    return;
  }
  // je Tonne den nächsten Termin, danach nach Datum sortieren
  const next={};
  for(const it of items){ if(WASTE[it.type] && (!next[it.type] || it.day<next[it.type].day)) next[it.type]=it }
  const list=Object.values(next).sort((a,b)=>a.day-b.day);
  box.innerHTML = list.map(it=>{
    const w=WASTE[it.type], n=daysFrom(it.day);
    const cls = n===0?"bin soon today":n===1?"bin soon":"bin";
    const extra = n===1 ? " · bis 6 Uhr rausstellen" : n===0 ? " · <b>heute!</b>" : "";
    return `<div class="${cls}"><div class="ic" style="background:${w.color}">${binIcon(w.shape)}</div>
      <div><div class="nm">${w.name}</div><div class="dt">${TK[it.day.getDay()]}, ${pad(it.day.getDate())}.${pad(it.day.getMonth()+1)}.${extra}</div></div>
      <div class="rel">${n===0?"HEUTE":relDay(n)}</div></div>`;
  }).join("") +
  // Tonnen ohne kommenden Termin (z. B. Grüngut im Winter) unten anzeigen
  Object.keys(WASTE).filter(k=>!next[k]).map(k=>{const w=WASTE[k];
    return `<div class="bin off"><div class="ic" style="background:${w.color}">${binIcon(w.shape)}</div>
      <div><div class="nm">${w.name}</div><div class="dt">${w.sub}</div></div><div class="rel">${k==="gruen"?"Winterpause":"kein Termin"}</div></div>`}).join("");
}

async function loadEvents(){
  let d;
  try{ d = await getJSON("data/events.json"); store.set("events",d) }catch(e){ d = store.get("events") }
  const box=$("events");
  const t0=today0();
  const up=(d&&d.items||[]).map(e=>({...e,s:parseDay(e.start),e2:e.end?parseDay(e.end):parseDay(e.start)}))
    .filter(e=>e.e2>=t0).sort((a,b)=>a.s-b.s);
  let pick = up.filter(e=>(e.importance??1)>=1).slice(0,5);
  if(pick.length<5) pick = pick.concat(up.filter(e=>!pick.includes(e)).slice(0,5-pick.length)).sort((a,b)=>a.s-b.s);
  if(!pick.length){ box.innerHTML=`<div class="hint">Gerade keine Termine im Kalender der Stadt.</div>`; return }
  box.innerHTML = pick.map(e=>{
    const running = e.s<t0;
    const shown = running ? t0 : e.s;
    const n = daysFrom(e.s);
    const until = e.end ? ` · bis ${pad(e.e2.getDate())}.${pad(e.e2.getMonth()+1)}.` : "";
    return `<div class="ev"><div class="cal"><div class="m">${MK[shown.getMonth()]}</div><div class="d">${shown.getDate()}</div></div>
      <div style="min-width:0"><div class="tt">${e.importance===2?'<span class="star">★</span> ':''}${esc(e.title)}</div>
      <div class="pl">${esc(e.place||e.org||"")}${until}</div></div>
      <div class="rl">${running?"läuft":relDay(n)}</div></div>`;
  }).join("");
}

let R=null, rIdx=0, rFilter="alle";
const FILTERS=[["alle","Alle"],["türkisch","Türkisch"],["deutsch","Deutsch"],["airfryer","Airfryer"]];
function rList(){
  if(!R) return [];
  return R.rezepte.filter(r=> rFilter==="alle" || (rFilter==="airfryer"?r.airfryer:r.kueche===rFilter));
}
function dayNo(){const n=new Date();return Math.floor((n - new Date(n.getFullYear(),0,0))/864e5)}
async function loadRezepte(){
  try{ R = await getJSON("data/rezepte.json"); store.set("rezepte",R) }catch(e){ R = store.get("rezepte") }
  if(!R) return;
  rIdx = dayNo() % R.rezepte.length;
  renderChips(); renderRezept(); renderTip();
}
function renderChips(){
  $("chips").innerHTML = FILTERS.map(([k,l])=>`<button class="chip ${k===rFilter?"on":""}" data-f="${k}">${l}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{rFilter=b.dataset.f; rIdx=dayNo(); renderChips(); renderRezept()});
}
function current(){const l=rList(); if(!l.length) return null; return l[((rIdx%l.length)+l.length)%l.length]}
function renderRezept(){
  const r=current(); if(!r) return;
  const tagK = r.kueche==="türkisch" ? "🇹🇷 Türkisch" : "🇩🇪 Deutsch";
  $("rname").textContent=r.name;
  $("rname").classList.remove("fade"); void $("rname").offsetWidth; $("rname").classList.add("fade");
  $("rmeta").innerHTML = `<span>⏱ ${r.zeit} Min</span><span>🍽 ${r.portionen} Portionen</span><span>🌾 ${r.kh==="wenig"?"wenig Kohlenhydrate":"mittel Kohlenhydrate"}</span>`;
  $("ring").innerHTML = r.zutaten.slice(0,6).map(z=>`<li>${esc(z)}</li>`).join("");
  $("rsteps").innerHTML = r.schritte.slice(0,4).map(s=>`<li><span>${esc(s)}</span></li>`).join("");
  $("rtip").innerHTML = `<b>Tipp:</b> ${esc(r.tipp)}`;
  $("rimg").innerHTML = `<div class="emo">${r.emoji||"🍽"}</div>
    <div class="badges"><span class="badge">${tagK}</span>${r.airfryer?'<span class="badge">💨 Airfryer</span>':''}<span class="badge">👆 Antippen: ganzes Rezept</span></div>`;
  loadPhoto(r);
}
async function loadPhoto(r){
  const key="img:"+r.bild; let src=store.get(key);
  if(!src){
    for(const lang of ["de","en"]){
      try{
        const u=`https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=1`+
          `&gsrsearch=${encodeURIComponent(r.bild)}&prop=pageimages&piprop=thumbnail&pithumbsize=900`;
        const j=await (await fetch(u)).json();
        const pg=j.query&&Object.values(j.query.pages)[0];
        if(pg&&pg.thumbnail){src=pg.thumbnail.source;break}
      }catch(e){}
    }
    if(src) store.set(key,src);
  }
  if(!src || current()!==r) return;
  const img=new Image(); img.alt=r.name; img.referrerPolicy="no-referrer";
  img.onload=()=>img.classList.add("ok"); img.onerror=()=>img.remove();
  img.src=src; $("rimg").prepend(img);
}
function openModal(){
  const r=current(); if(!r) return;
  $("mcard").innerHTML = `<button class="close" aria-label="Schließen">✕</button>
    <div class="label">${r.kueche==="türkisch"?"Türkische":"Deutsche"} Küche${r.airfryer?" · Airfryer":""} · ${r.zeit} Min · ${r.portionen} Portionen</div>
    <h2>${r.emoji||""} ${esc(r.name)}</h2>
    <div class="cols"><div><h4>Zutaten</h4><ul>${r.zutaten.map(z=>`<li>${esc(z)}</li>`).join("")}</ul></div>
    <div><h4>Zubereitung</h4><ol>${r.schritte.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
    <p style="margin-top:14px"><b style="color:#ffd76a">Tipp:</b> ${esc(r.tipp)}</p></div></div>
    <p class="small" style="margin-top:18px">${esc(R.hinweis)}</p>`;
  $("modal").classList.add("open");
  $("mcard").querySelector(".close").onclick=closeModal;
}
function closeModal(){$("modal").classList.remove("open")}
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
$("rprev").onclick=()=>{rIdx--;renderRezept()};
$("rnext").onclick=()=>{rIdx++;renderRezept()};

/* Tipp oben: wechselt zwischen Airfryer- und Gesund-Tipps */
let tipN=0;
function renderTip(){
  if(!R) return;
  const air = tipN%2===0;
  const arr = air ? R.airfryerTipps : R.gesundTipps;
  const t = arr[(dayNo()*3 + Math.floor(tipN/2)) % arr.length];
  $("tipline").innerHTML = `<div class="ico">${air?"💨":"🥗"}</div><div class="fade"><b>${air?"Airfryer-Tipp":"Leicht & satt"}</b>${esc(t)}</div>`;
  tipN++;
}

const IS_ANDROID = /Android/i.test(navigator.userAgent);
function startApp(pkg, web){
  // Am PC oder iPhone: Webseite in neuem Tab öffnen
  if(!IS_ANDROID && !window.fully){ window.open(web, "_blank", "noopener"); return }
  try{
    if(window.fully && fully.startApplication){ fully.startApplication(pkg); return }
  }catch(e){}
  location.href = `intent://#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=${pkg};end`;
}
$("dock").innerHTML = APPS.map((a,i)=>`<button class="appbtn" data-i="${i}">${APPICON[a.icon]||APPICON.web}<span>${a.name}</span></button>`).join("");
$("dock").querySelectorAll(".appbtn").forEach(b=>b.onclick=()=>startApp(APPS[b.dataset.i].pkg, APPS[b.dataset.i].web));

/* ======================================================================
   Start + Aktualisierung
   ====================================================================== */
tick(); setInterval(tick, 5000);
loadWeather(); loadAbfall(); loadEvents(); loadRezepte();
setInterval(loadWeather, 20*60e3);
setInterval(renderSun, 5*60e3);
setInterval(()=>{loadAbfall(); loadEvents()}, 60*60e3);
setInterval(renderTip, 45e3);
// Neuer Tag: Listen neu sortieren, Rezept des Tages wechseln
let lastDay=new Date().getDate();
setInterval(()=>{const d=new Date().getDate(); if(d!==lastDay){lastDay=d; loadAbfall(); loadEvents(); loadRezepte()}}, 60e3);
// Einmal nachts komplett neu laden (holt auch neue Versionen der Seite)
setInterval(()=>{const n=new Date(); if(n.getHours()===4 && n.getMinutes()===30) location.reload()}, 60e3);
// Display schonen: alle 3 Minuten minimal verschieben
setInterval(()=>{$("app").style.transform=`translate(${Math.round(Math.random()*4-2)}px,${Math.round(Math.random()*4-2)}px)`}, 180e3);
</script>
</body>
</html>
